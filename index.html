<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <title>teoe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
        }
      }
    </script>
    <link rel="stylesheet" href="style.css?v=shark-animatronic-1" />
    <script src="script.js?v=webgl-stability-3" defer></script>
  </head>
  <body>
    <main class="screen">
      <section id="intro" class="intro" aria-label="Opening text">
        <h1 id="title">i am coming</h1>
      </section>
      <section id="menu" class="menu" aria-label="Main menu" hidden>
        <img class="skeleton-art" src="skull-background.png" alt="Low-contrast black-and-white skull" />
        <div class="menu-content">
          <h1 class="menu-title">teoe</h1>
          <div id="passcode-container" class="passcode-container" aria-label="Access code entry">
            <label class="passcode-label" for="passcode-input">Access code</label>
            <div class="passcode-row">
              <input
                id="passcode-input"
                class="passcode-input"
                type="password"
                inputmode="numeric"
                maxlength="5"
                autocomplete="off"
                aria-describedby="passcode-error"
                placeholder="•••••"
              />
              <button id="play-button" class="play-button" type="button">Play</button>
            </div>
            <p id="passcode-error" class="passcode-error" hidden>Incorrect access code.</p>
          </div>
        </div>
      </section>
      <section id="grass-game" class="grass-game" aria-label="Grass scene" hidden>
        <canvas id="grass-canvas" class="grass-canvas" aria-label="Three-dimensional grass model"></canvas>
        <div id="blood-overlay" class="blood-overlay" aria-hidden="true"></div>
        <div id="vision-blink" class="vision-blink" aria-hidden="true"></div>
        <section id="animatronic-death" class="animatronic-death" role="dialog" aria-modal="true" aria-labelledby="death-title" hidden>
          <div class="death-card">
            <p class="death-kicker">ABANDONED BUILDING</p>
            <h2 id="death-title">IT CAUGHT YOU</h2>
            <p>You looked at the shark, or the Diabolus Rex caught you.</p>
            <button id="death-restart" class="play-button" type="button">Wake up again</button>
          </div>
        </section>
        <p id="grass-status" class="grass-status" role="status" aria-live="polite"></p>
        <span class="grass-reticle" aria-hidden="true"></span>
        <p id="grass-controls" class="grass-controls">WASD / arrows to move · drag to look · keep the lamp in view for 3 seconds</p>
        <button id="back-button" class="back-button" type="button">Back to menu</button>
      </section>
    </main>
  </body>
</html>
